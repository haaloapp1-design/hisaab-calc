<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator — Scientific mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D46B9}a:hover{color:#1F3391}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #2D46B9; font-family: Ubuntu, 'Segoe UI', Roboto, sans-serif; color: #18224F; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0">
    <span style="width: 44px"></span>
    <div style="display: flex; align-items: center; gap: 8px; color: #FFFFFF; font-size: 17px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7D1FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path></svg>
      Calculator
    </div>
    <a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
  </div>

  <div style="display: flex; gap: 4px; margin: 14px 20px 0; padding: 4px; background: #3E58C8; border-radius: 14px">
    <a href="Main.dc.html" style="flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; color: #E4E9FF; font-size: 14px; text-decoration: none">Basic</a>
    <a href="Scientific.dc.html" style="flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; background: #FFFFFF; color: #2D46B9; font-size: 14px; font-weight: 500; text-decoration: none">Scientific</a>
    <a href="Programmer.dc.html" style="flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; color: #E4E9FF; font-size: 14px; text-decoration: none">Programmer</a>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 24px 18px; gap: 8px">
    <div style="display: flex; gap: 6px">
      <button onClick="{{setDeg}}" style="{{degStyle}}">DEG</button>
      <button onClick="{{setRad}}" style="{{radStyle}}">RAD</button>
    </div>
    <div style="text-align: right; font-size: 19px; color: #DDE3FF">sin(30) + √144 × 2²</div>
    <div style="height: 1px; background: #5A72D6"></div>
    <div style="text-align: right; font-size: 52px; font-weight: 500; color: #FFFFFF; line-height: 1.05">{{result}}</div>
  </div>

  <div style="background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 44px; height: 4px; border-radius: 2px; background: #2D46B9; align-self: center"></div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="35">
        <sc-if value="{{k.sci}}" hint-placeholder-val="{{true}}">
          <button aria-label="{{k.label}}" style="height: 46px; border-radius: 14px; border: 1px solid #E4E8F7; background: #EEF1FB; color: #2D46B9; font-size: 16px; font-weight: 500">{{k.t}}</button>
        </sc-if>
        <sc-if value="{{k.num}}">
          <button aria-label="{{k.label}}" style="height: 46px; border-radius: 14px; border: 1px solid #E4E8F7; background: #F9FAFE; color: #18224F; font-size: 22px">{{k.t}}</button>
        </sc-if>
        <sc-if value="{{k.fn}}">
          <button aria-label="{{k.label}}" style="height: 46px; border-radius: 14px; border: 1px solid #E4E8F7; background: #F9FAFE; color: #2D46B9; font-size: 19px; font-weight: 700">{{k.t}}</button>
        </sc-if>
        <sc-if value="{{k.op}}">
          <button aria-label="{{k.label}}" style="height: 46px; border-radius: 14px; border: 1px solid #D6DDF8; background: #E6EBFC; color: #2D46B9; font-size: 24px">{{k.t}}</button>
        </sc-if>
        <sc-if value="{{k.eq}}">
          <button aria-label="Equals" style="height: 46px; border-radius: 14px; border: none; background: #2D46B9; color: #FFFFFF; font-size: 26px">=</button>
        </sc-if>
      </sc-for>
    </div>
    <nav aria-label="Main" style="display: flex; gap: 6px; border-top: 1px solid #EDF0FA; padding-top: 10px">
      <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; background: #E6EBFC; color: #2D46B9; text-decoration: none; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"></rect><path d="M8.5 7h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"></path></svg>Calculator</a>
      <a href="Convert.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"></path></svg>Convert</a>
      <a href="Tools.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Tools</a>
      <a href="History.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>History</a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { angle: 'deg' }; }
  renderVals() {
    const on = 'padding: 6px 12px; border-radius: 10px; border: none; background: #FFFFFF; color: #2D46B9; font-size: 13px; font-weight: 700';
    const off = 'padding: 6px 12px; border-radius: 10px; border: 1px solid #5A72D6; background: transparent; color: #DDE3FF; font-size: 13px';
    const deg = this.state.angle === 'deg';
    const spec = [
      ['2nd','sci','Second functions'],['sin','sci','Sine'],['cos','sci','Cosine'],['tan','sci','Tangent'],['π','sci','Pi'],
      ['x²','sci','Square'],['xʸ','sci','Power'],['√x','sci','Square root'],['ln','sci','Natural log'],['log','sci','Log base 10'],
      ['(','sci','Open bracket'],[')','sci','Close bracket'],['n!','sci','Factorial'],['1/x','sci','Reciprocal'],['e','sci','Euler number'],
      ['7','num'],['8','num'],['9','num'],['C','fn','Clear'],['⌫','fn','Backspace'],
      ['4','num'],['5','num'],['6','num'],['×','op','Multiply'],['÷','op','Divide'],
      ['1','num'],['2','num'],['3','num'],['+','op','Add'],['−','op','Subtract'],
      ['±','fn','Toggle sign'],['0','num'],['.','num','Decimal point'],['Ans','sci','Last answer'],['=','eq','Equals']
    ];
    const keys = spec.map(([t, kind, label]) => ({ t, label: label || t, sci: kind === 'sci', num: kind === 'num', fn: kind === 'fn', op: kind === 'op', eq: kind === 'eq' }));
    return {
      keys,
      degStyle: deg ? on : off,
      radStyle: deg ? off : on,
      result: deg ? '48.5' : '47.0120',
      setDeg: () => this.setState({ angle: 'deg' }),
      setRad: () => this.setState({ angle: 'rad' })
    };
  }
}
</script>
</body>
</html>
