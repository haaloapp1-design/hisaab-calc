<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator — Currency converter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D46B9}a:hover{color:#1F3391}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #2D46B9; font-family: Ubuntu, 'Segoe UI', Roboto, sans-serif; color: #FFFFFF; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0">
    <a href="Convert.dc.html" aria-label="Back to converter categories" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 500">Currency</div>
    <button aria-label="Refresh rates" style="width: 44px; height: 44px; border: none; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>
    </button>
  </div>

  <div style="padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button style="display: flex; align-items: center; gap: 8px; border: none; background: #FFFFFF; color: #2D46B9; padding: 8px 12px; border-radius: 12px; font-size: 15px; font-weight: 700">PKR
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="font-size: 14px; color: #DDE3FF">Pakistani rupee</span>
    </div>
    <div style="text-align: right; font-size: 52px; font-weight: 500">10,000</div>
    <div style="height: 1px; background: #5A72D6"></div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #DDE3FF">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #F5B971"></span>
      Example rates shown. Live rates load from the rates API.
    </div>
  </div>

  <div style="flex: 1; background: #FFFFFF; border-radius: 32px 32px 0 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px; color: #18224F; overflow: hidden">
    <div style="width: 44px; height: 4px; border-radius: 2px; background: #2D46B9; align-self: center"></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <button style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 16px; border: 1px solid #E4E8F7; background: #F9FAFE; color: #18224F; text-align: left">
        <span style="width: 48px; height: 40px; border-radius: 12px; background: #E6EBFC; color: #2D46B9; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{r.code}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px">{{r.name}}</span>
          <span style="font-size: 12px; color: #5A6487">{{r.rate}}</span>
        </span>
        <span style="font-size: 20px; font-weight: 500">{{r.val}}</span>
      </button>
    </sc-for>
    <button style="height: 48px; border-radius: 16px; border: 1px dashed #9FB0F2; background: #FFFFFF; color: #2D46B9; font-size: 15px; font-weight: 500">Add currency</button>
  </div>

  <nav aria-label="Main" style="display: flex; gap: 6px; background: #FFFFFF; border-top: 1px solid #EDF0FA; padding: 10px 20px 14px">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"></rect><path d="M8.5 7h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"></path></svg>Calculator</a>
    <a href="Convert.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; background: #E6EBFC; color: #2D46B9; text-decoration: none; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"></path></svg>Convert</a>
    <a href="Tools.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Tools</a>
    <a href="History.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>History</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { code: 'USD', name: 'US dollar', rate: '1 USD = 280.00 PKR (example)', val: '35.71' },
        { code: 'EUR', name: 'Euro', rate: '1 EUR = 325.00 PKR (example)', val: '30.77' },
        { code: 'GBP', name: 'British pound', rate: '1 GBP = 375.00 PKR (example)', val: '26.67' },
        { code: 'AED', name: 'UAE dirham', rate: '1 AED = 76.20 PKR (example)', val: '131.23' },
        { code: 'SAR', name: 'Saudi riyal', rate: '1 SAR = 74.70 PKR (example)', val: '133.87' }
      ]
    };
  }
}
</script>
</body>
</html>
