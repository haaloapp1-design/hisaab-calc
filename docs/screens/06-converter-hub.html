<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calculator — Converter categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D46B9}a:hover{color:#1F3391}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F6FD; font-family: Ubuntu, 'Segoe UI', Roboto, sans-serif; color: #18224F; overflow: hidden">

  <div style="background: #2D46B9; padding: 24px 20px 20px; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 14px; color: #FFFFFF">
    <div style="font-size: 26px; font-weight: 500">Convert</div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; color: #5A6487">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input type="search" placeholder="Search units, e.g. inch or psi" aria-label="Search units" style="flex: 1; border: none; outline: none; font-size: 15px; color: #18224F; background: transparent">
    </label>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <a href="Currency.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E8F7; text-decoration: none; color: #18224F">
      <span style="width: 46px; height: 46px; border-radius: 14px; background: #2D46B9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">$</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 500">Currency</span>
        <span style="font-size: 13px; color: #5A6487">Live rates, works offline with last saved rates</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D46B9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="12">
        <a href="UnitConvert.dc.html" style="height: 86px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E8F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #18224F">
          <span style="min-width: 40px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; background: #E6EBFC; color: #2D46B9; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{c.sym}}</span>
          <span style="font-size: 13px">{{c.name}}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="display: flex; gap: 6px; background: #FFFFFF; border-top: 1px solid #EDF0FA; padding: 10px 20px 14px">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"></rect><path d="M8.5 7h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"></path></svg>Calculator</a>
    <a href="Convert.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; background: #E6EBFC; color: #2D46B9; text-decoration: none; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15l-4-4M20 16H5l4 4"></path></svg>Convert</a>
    <a href="Tools.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Tools</a>
    <a href="History.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; color: #5A6487; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>History</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cats = [
      ['m', 'Length'], ['m²', 'Area'], ['L', 'Volume'],
      ['kg', 'Mass'], ['°C', 'Temperature'], ['km/h', 'Speed'],
      ['h', 'Time'], ['MB', 'Data'], ['Pa', 'Pressure'],
      ['J', 'Energy'], ['W', 'Power'], ['rad', 'Angle']
    ].map(([sym, name]) => ({ sym, name }));
    return { cats };
  }
}
</script>
</body>
</html>
